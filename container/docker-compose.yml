services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pantera
      POSTGRES_USER: pantera_user
      POSTGRES_PASSWORD: pantera_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../server:/app
    command: python run.py
    env_file:
      - ../server/.env
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../client:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
