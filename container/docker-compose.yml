services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: pantera
      POSTGRES_USER: pantera_user
      POSTGRES_PASSWORD: pantera_pass

    volumes:
      - ${DB_DATA_PATH:-postgres_data}:/var/lib/postgresql/data

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantera_user -d pantera"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
      
  backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../server:/app
    command: python run.py
    env_file:
      - ../server/.env
    environment:
      FLASK_APP: manage:app
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../client:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: pantera_pass
      POSTGRES_HOST: postgres
      POSTGRES_DB: pantera
      POSTGRES_USER: pantera_user
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    command: bash /backup.sh
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:
    # Используется только если DB_DATA_PATH не задан в .env

networks:
  app-network:
    driver: bridge
